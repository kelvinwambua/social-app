<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  <link rel="preconnect" href="https://bsky.social">
  <link rel="preconnect" href="https://go.bsky.app">
  <title>{%- block head_title -%}Sparkable{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  <link rel="preload" as="font" type="font/woff2" href="{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2" crossorigin>

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
     */
    @font-face {
      font-family: 'InterVariable';
      src: url("{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'InterVariableItalic';
      src: url("{{ staticCDNHost }}/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: italic;
      font-display: swap;
    }
    html,
    body {
      margin: 0px;
      padding: 0px;
      font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }
    :root {
      --text: black;
      --background: white;
      --backgroundLight: #e2e7ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --text: white;
        --background: black;
        --backgroundLight: #232e3e;
      }
    }
    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100%;
      width: 100%;
    }
    html.theme--light,
    html.theme--light body,
    html.theme--light #root {
      background-color: white;
      --text: black;
      --background: white;
      --backgroundLight: #DCE2EA;
    }
    html.theme--dark,
    html.theme--dark body,
    html.theme--dark #root {
      color-scheme: dark;
      background-color: black;
      --text: white;
      --background: black;
      --backgroundLight: #232E3E;
    }
    html.theme--dim,
    html.theme--dim body,
    html.theme--dim #root {
      color-scheme: dark;
      background-color: #151D28;
      --text: white;
      --background: #151D28;
      --backgroundLight: #2C3A4E;
    }
    #splash {
      display: flex;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      align-items: center;
      justify-content: center;
    }
    #splash svg {
      position: relative;
      top: -50px;
      width: 100px;
    }
    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>
  <script>
    /*
     * TEMPORARY boot-level error trap. Sits outside the app bundle so it also
     * catches exceptions thrown while that bundle evaluates, which otherwise
     * show as a blank white page. Remove once sign-in is confirmed working.
     *
     * Deliberately free of backslash escapes - an earlier version embedded a
     * literal newline into a string literal and silently failed to parse.
     */
    (function () {
      var NL = String.fromCharCode(10);
      function show(label, detail) {
        try {
          var el = document.createElement("pre");
          el.style.cssText =
            "position:fixed;inset:0;z-index:99999;margin:0;padding:16px;" +
            "background:#111;color:#f88;font:12px/1.4 monospace;" +
            "white-space:pre-wrap;overflow:auto";
          el.textContent = label + NL + NL + detail;
          (document.body || document.documentElement).appendChild(el);
        } catch (_) {}
      }
      function report(kind, message, detail, file, line, col) {
        try {
          fetch("/__boot-error", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              kind: kind,
              message: String(message),
              stack: String(detail || ""),
              file: String(file || ""),
              line: line || 0,
              col: col || 0,
            }),
          });
        } catch (_) {}
      }
      window.addEventListener("error", function (e) {
        var stack = (e && e.error && e.error.stack) || "";
        /*
         * Blob-URL errors come from third-party Web Workers (Sentry Replay,
         * mediabunny). Upstream Bluesky ignores this same class in its Sentry
         * config ("t is not defined"), so surfacing them here is pure noise
         * that hides real failures.
         */
        var f = String((e && e.filename) || "");
        if (f.indexOf("blob:") === 0) return;
        show("Boot error:", (e && e.message) + NL + stack);
        report("error", e && e.message, stack, e && e.filename, e && e.lineno, e && e.colno);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason;
        var d = (r && (r.stack || r.message)) || String(r);
        show("Unhandled rejection:", d);
        report("rejection", (r && r.message) || String(r), d, "", 0, 0);
      });
      window.__bootTrap = true;
    })();
  </script>
  <script>
    const theme = localStorage.getItem('ALF_THEME')
    if (theme) {
      document.documentElement.classList.add(`theme--${theme}`)
    }
  </script>

  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ staticCDNHost }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#4153F5">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4153F5">
  <meta name="application-name" content="Sparkable">
  <meta name="generator" content="bskyweb">
  {% if noindex %}<meta name="robots" content="noindex{% if nofollow %}, nofollow{% endif %}">{% endif %}
  <meta property="og:site_name" content="Sparkable">
  <meta property="og:logo" content="{{ siteOrigin }}/static/favicon.png">
  <meta name="twitter:site" content="@sparkable" />
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>
<body>
{%- block body_all %}
  <div id="splash">
    <!-- Sparkable SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path fill="#4153F5" d="M63 1C44 24 44 40 63 63C40 44 24 44 1 63C20 40 20 24 1 1C24 20 40 20 63 1Z"/></svg>
  </div>
  <div id="root">
  </div>

  <noscript>
    <h1 lang="en">JavaScript Required</h1>
    <p lang="en">This is a heavily interactive web application, and JavaScript is required. Simple HTML interfaces are possible, but that is not what this is.
    <p lang="en">Learn more about Sparkable at <a href="https://sparkable.cc">sparkable.cc</a> and about the underlying protocol at <a href="https://atproto.com">atproto.com</a>.
    {% block noscript_extra %}{% endblock %}
  </noscript>
{% endblock -%}
</body>
</html>
